<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>몬스터 카드 팩 개봉 시뮬레이터</title>
<!-- rev 36 · 2026-11-06 : X 0.1% · 합성 천장(SR→UR 15회, UR→X 20회) · 스타터 팩 -->
<style>
:root{--text:#eef0ff;--muted:#8e93bd;--accent:#ffcb3d;--panel:#1a1e3a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#2a2f66 0%,#0f1226 62%) fixed;color:var(--text);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;overflow-x:hidden;user-select:none}
.hide{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px;flex-wrap:wrap}
h1{font-size:18px;letter-spacing:.5px}
h1 span{color:var(--accent)}
nav{display:flex;gap:6px;align-items:center}
.btn,nav button{background:var(--panel);color:var(--text);border:1px solid #343a70;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover,nav button:hover{background:#252a52}
nav button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700}
.btn.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700}
.btn.danger{border-color:#7a2a3a;color:#ff8da1}
.view{display:none;padding:0 14px 30px}
.view.active{display:block}
.hint{color:var(--muted);font-size:14px;text-align:center;margin-top:14px;min-height:20px}
body:has(#packArea:not(.hide)) #flash{background:radial-gradient(circle at 50% 38%,#fff 0,#e8f3ff 38%,#c4b8ff 100%)!important}

/* ---------- 팩 ---------- */
.pack-area{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 120px);gap:6px}
.pack{position:relative;width:230px;height:350px;touch-action:none;cursor:grab;filter:drop-shadow(0 22px 28px rgba(0,0,0,.55));transition:transform .55s ease-in,opacity .55s ease-in;animation:float 3s ease-in-out infinite}
.pack:active{cursor:grabbing}
.pack.opened{animation:none}
.pack.leave{transform:translateY(140px) scale(.85);opacity:0}
@keyframes float{50%{transform:translateY(-8px)}}
.foil{background-image:linear-gradient(135deg,#2a2fb8 0%,#1c7fd6 35%,#6a3fd1 70%,#2a2fb8 100%);background-size:230px 350px}
.pack-body{position:absolute;left:0;right:0;top:46px;bottom:0;border-radius:0 0 12px 12px;background-position:0 -46px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.pack-body::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 2px,rgba(0,0,0,.25) 2px 4px)}
.pack-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(60deg,transparent 0 22px,rgba(255,255,255,.06) 22px 44px)}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:250% 100%;animation:sheen 3.2s linear infinite;mix-blend-mode:overlay}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
.pk-title{font-weight:900;font-size:26px;line-height:1.05;letter-spacing:2px;color:#ffe27a;text-shadow:0 2px 0 #7a4b00,0 0 14px rgba(255,203,61,.6);z-index:1}
.pk-emoji{font-size:84px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));z-index:1}
.pk-sub{font-size:11px;letter-spacing:1.5px;color:#cfe3ff;z-index:1}
.strip{position:absolute;left:0;top:0;width:100%;height:46px;border-radius:12px 12px 0 0;background-position:0 0;z-index:3;border-bottom:2px dashed rgba(255,255,255,.6)}
.strip::before{content:'';position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 2px,rgba(0,0,0,.25) 2px 4px);border-radius:12px 12px 0 0}
.strip-intact::after{content:'드래그 ▶▶▶';position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:2px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.opening{position:absolute;left:3px;right:3px;top:44px;height:4px;border-radius:4px;z-index:1;opacity:0;pointer-events:none;transform-origin:50% 50%;
  background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.9) 14%,#fff 50%,rgba(255,255,255,.9) 86%,transparent 100%);
  box-shadow:0 0 5px 1px rgba(255,255,255,.95),0 0 16px 3px rgba(165,215,255,.8),0 0 40px 10px rgba(140,120,255,.5)}
.opening::before{content:'';position:absolute;left:50%;bottom:50%;width:460px;height:340px;margin-left:-230px;opacity:0;transform-origin:50% 100%;
  background:repeating-conic-gradient(from -72deg at 50% 100%,rgba(255,255,255,.5) 0 1deg,transparent 1deg 6.5deg),radial-gradient(ellipse 60% 100% at 50% 100%,rgba(190,225,255,.5),transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 100%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse 100% 100% at 50% 100%,#000 0,transparent 75%)}
.opening::after{content:'';position:absolute;top:50%;left:0;width:90px;height:90px;margin:-45px 0 0 -45px;opacity:0;
  background:radial-gradient(circle,#fff 0,rgba(205,230,255,.8) 22%,rgba(150,130,255,.35) 45%,transparent 70%)}
.pack.opened .opening{opacity:1;animation:opLine 1.3s cubic-bezier(.2,.8,.2,1) both}
.pack.opened .opening::before{animation:opBeam 1.3s .15s cubic-bezier(.2,.7,.2,1) both}
.pack.opened .opening::after{animation:opFlare .75s cubic-bezier(.35,.1,.2,1) both}
@keyframes opLine{0%{opacity:0;transform:scaleX(.04)}22%{opacity:1;transform:scaleX(1)}100%{opacity:.8;transform:scaleX(1)}}
@keyframes opBeam{0%{opacity:0;transform:scaleY(.2)}30%{opacity:1}100%{opacity:.35;transform:scaleY(1)}}
@keyframes opFlare{0%{left:0;opacity:0}12%{opacity:1}100%{left:100%;opacity:0}}
.pack.opened .strip{transition:transform .6s ease-in,opacity .6s}
.pack.opened .strip-torn{transform:translate(-150px,-290px) rotate(-85deg)!important;opacity:0}
.pack.opened .strip-intact{transform:translate(90px,-220px) rotate(55deg)!important;opacity:0}
.pack.opened .pack-body{animation:ppulse .9s ease-out forwards}
@keyframes ppulse{0%{filter:brightness(1);box-shadow:inset 0 0 0 rgba(255,255,255,0)}25%{filter:brightness(1.35) saturate(1.15);box-shadow:inset 0 14px 22px -8px rgba(255,255,255,.75)}100%{filter:brightness(1.08);box-shadow:inset 0 6px 14px -8px rgba(200,225,255,.55)}}

/* ---------- 카드 ---------- */
.card-wrap{--fs:14px;font-size:var(--fs);width:16em;height:22.4em;position:relative;perspective:900px;flex:none}
.tilt{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s ease-out}
.card-wrap.active .tilt{transition:transform .08s linear}
.flipper{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.25,.5,1)}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:.9em;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 .6em 1.6em rgba(0,0,0,.5)}
.front{transform:rotateY(180deg);padding:.5em;background:linear-gradient(135deg,#9aa1b3,#dfe3ee,#9aa1b3)}
.r-U .front{background:linear-gradient(135deg,#3aa56a,#c9f5da,#3aa56a)}
.r-R .front{background:linear-gradient(135deg,#2a77d6,#bfe0ff,#2a77d6)}
.r-SR .front{background:linear-gradient(135deg,#8a3fd8,#f0d2ff,#8a3fd8)}
.r-UR .front{background:linear-gradient(135deg,#b8860b,#fff0a0,#d4a017,#fff0a0,#b8860b);background-size:300% 300%;animation:gold 3s linear infinite}
@keyframes gold{to{background-position:300% 300%}}
.inner{position:relative;height:100%;border-radius:.65em;background:linear-gradient(180deg,#fffdf5,#efe9d6);color:#222;display:flex;flex-direction:column;padding:.45em .5em;overflow:hidden}
.c-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.c-name{font-size:1.15em}
.c-hp{font-size:.85em;color:#c0392b}
.c-art{position:relative;margin:.35em 0;height:10.2em;border-radius:.4em;background:linear-gradient(135deg,var(--t1),var(--t2));display:grid;place-items:center;border:.15em solid rgba(0,0,0,.35);box-shadow:inset 0 0 1.2em rgba(0,0,0,.25);overflow:hidden}
.c-art::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.55) 0 .25em,transparent .3em),radial-gradient(circle at 80% 70%,rgba(255,255,255,.4) 0 .2em,transparent .25em),repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 .5em,transparent .5em 1em)}
.c-art .emoji{position:relative;font-size:6.2em;line-height:1;filter:drop-shadow(0 .08em .12em rgba(0,0,0,.45))}
.c-type{position:absolute;left:.4em;bottom:.3em;font-size:.7em;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:1em;padding:.1em .6em}
.c-atk{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.25em;border-top:.08em solid rgba(0,0,0,.15);padding-top:.3em}
.c-atk .row{display:flex;justify-content:space-between;font-weight:800;font-size:.95em}
.c-atk .fl{font-size:.68em;color:#666;line-height:1.35}
.c-foot{display:flex;justify-content:space-between;font-size:.68em;font-weight:800;color:var(--rc);border-top:.08em solid rgba(0,0,0,.12);padding-top:.25em}
#reveal .skip{position:static!important;right:auto!important;bottom:auto!important;align-self:center;margin:6px 0 0;padding:8px 18px;font-size:13px;z-index:5}
.new{position:absolute;top:.7em;right:.7em;background:#ff3b5c;color:#fff;font-size:.7em;font-weight:900;padding:.15em .5em;border-radius:.4em;z-index:5;transform:rotate(6deg)}
.holo,.glare{position:absolute;inset:0;pointer-events:none;border-radius:.9em}
.holo{opacity:0;mix-blend-mode:color-dodge;filter:brightness(.75) contrast(1.25);
  background:repeating-linear-gradient(115deg,#ff0080 0%,#ffd000 8%,#00ff90 16%,#00c8ff 24%,#8a00ff 32%,#ff0080 40%);background-size:250% 250%;
  background-position:calc(var(--mx,50)*1%) calc(var(--my,50)*1%);animation:shimmer 4s ease-in-out infinite alternate}
.card-wrap.active .holo{animation:none}
@keyframes shimmer{from{background-position:0% 20%}to{background-position:100% 80%}}
.r-R .holo{opacity:.35}
.r-SR .holo{opacity:.55}
.r-UR .holo{opacity:.75}
.glare{mix-blend-mode:overlay;opacity:0;transition:opacity .3s;background:radial-gradient(circle at calc(var(--mx,50)*1%) calc(var(--my,50)*1%),rgba(255,255,255,.75),transparent 55%)}
.card-wrap.active .glare{opacity:.8}
.r-UR .front::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;animation:twinkle 1.6s infinite alternate;
  background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 40% 70%,#fff 0 1.5px,transparent 3px),radial-gradient(circle at 85% 80%,#fff 0 1px,transparent 2px),radial-gradient(circle at 10% 85%,#ffe27a 0 1.5px,transparent 3px);
  background-size:70px 70px,90px 90px,110px 110px,60px 60px,80px 80px}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
/* ---------- 등급별 카드 외관 (v2) ---------- */
.inner>*{position:relative;z-index:1}
.inner::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0}
.c-art .emoji{z-index:1}
.c-type{z-index:2}
.r-C .inner{background:linear-gradient(180deg,#f3f3ef,#e0e0d9)}
.r-C .c-art{box-shadow:none;border-color:rgba(0,0,0,.25)}
.r-C .c-art::before{background:none}
.r-U .inner{background:linear-gradient(180deg,#f8fff9,#dff3e6);box-shadow:inset 0 0 0 .12em rgba(58,165,106,.6)}
.r-U .c-art{border-color:#2c8a55}
.r-U .c-name{color:#1f6b40}
.r-R .inner{background:linear-gradient(180deg,#f6fbff,#dcebfb);box-shadow:inset 0 0 0 .14em rgba(42,119,214,.65)}
.r-R .c-art{border-color:#1d5fb0;box-shadow:inset 0 0 1.2em rgba(0,0,0,.25),0 0 .5em rgba(74,168,255,.6)}
.r-R .c-art::after{content:'★';position:absolute;right:.35em;top:.15em;font-size:1.1em;color:#fff;text-shadow:0 0 .4em #4aa8ff}
.r-R .c-name{color:#12427f}
.r-SR .inner{background:linear-gradient(180deg,#fbf6ff,#e6d8f7);box-shadow:inset 0 0 0 .16em rgba(138,63,216,.7),inset 0 0 0 .3em rgba(255,255,255,.7),inset 0 0 0 .38em rgba(138,63,216,.45)}
.r-SR .inner::before{inset:.28em;border:.1em solid rgba(192,107,255,.55);border-radius:.45em}
.r-SR .c-art{border-color:#6a2fb0;box-shadow:inset 0 0 1.2em rgba(0,0,0,.3),0 0 .7em rgba(192,107,255,.8)}
.r-SR .c-art::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 .35em,rgba(255,255,255,.2) .35em .5em);mix-blend-mode:overlay}
.r-SR .c-name{background:linear-gradient(90deg,#5b1fa5,#c06bff,#5b1fa5);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-UR .inner{background:linear-gradient(180deg,#fffbe8,#f6e6a8 60%,#ecd37a);box-shadow:inset 0 0 0 .16em #c9951a,inset 0 0 0 .3em #fff3b0,inset 0 0 0 .4em #c9951a}
.r-UR .inner::before{inset:.3em;border:.1em solid rgba(201,149,26,.8);border-radius:.45em}
.r-UR .c-art{border-color:#8a5a00;box-shadow:inset 0 0 1.4em rgba(0,0,0,.3),0 0 .9em rgba(255,203,61,.9)}
.r-UR .c-art::after{content:'';position:absolute;inset:-50%;background:conic-gradient(transparent 0 20deg,rgba(255,255,255,.4) 30deg,transparent 40deg 120deg,rgba(255,255,255,.35) 130deg,transparent 140deg 240deg,rgba(255,255,255,.35) 250deg,transparent 260deg);animation:spin 8s linear infinite;mix-blend-mode:overlay}
.r-UR .c-name{background:linear-gradient(90deg,#7a4b00,#e0a800,#7a4b00);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-X .front{background:linear-gradient(135deg,#ff3d8b,#ffcb3d,#3dff9a,#3dc8ff,#8a3dff,#ff3d8b);background-size:300% 300%;animation:gold 2.5s linear infinite}
.r-X .inner{background:radial-gradient(circle at 50% 30%,#2b1e6b 0,#120b33 60%,#06041a 100%);color:#fff;box-shadow:inset 0 0 0 .14em #fff,inset 0 0 1.4em rgba(138,61,255,.9)}
.r-X .inner::before{background:radial-gradient(circle at 15% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 75% 35%,#9ff 0 1px,transparent 2px),radial-gradient(circle at 45% 80%,#fff 0 1.5px,transparent 3px);background-size:60px 60px,80px 80px,100px 100px;animation:twinkle 1.4s infinite alternate}
.r-X .c-name{background:linear-gradient(90deg,#ff7ad9,#ffe27a,#7affc9,#7ad7ff,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-X .c-hp{color:#ff8da1}
.r-X .c-art{border-color:#fff;box-shadow:inset 0 0 1.4em rgba(0,0,0,.35),0 0 1em #fff,0 0 1.8em rgba(255,92,225,.8)}
.r-X .c-art::after{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.4) 0 8deg,transparent 8deg 24deg);animation:spin 10s linear infinite;mix-blend-mode:overlay}
.r-X .c-atk{border-top-color:rgba(255,255,255,.3)}
.r-X .c-atk .fl{color:#cdd2ff}
.r-X .c-foot{color:#fff;border-top-color:rgba(255,255,255,.3)}
.r-X .holo{opacity:.9}
.r-X .front::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;animation:twinkle 1.2s infinite alternate;background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,#8ff 0 1px,transparent 2px),radial-gradient(circle at 40% 70%,#fff 0 1.5px,transparent 3px),radial-gradient(circle at 85% 80%,#f9f 0 1.5px,transparent 3px),radial-gradient(circle at 10% 85%,#ffe27a 0 1.5px,transparent 3px);background-size:50px 50px,70px 70px,90px 90px,60px 60px,80px 80px}
.reveal.x .rays{opacity:1;background:repeating-conic-gradient(rgba(255,80,200,.45) 0 6deg,rgba(80,200,255,.4) 6deg 12deg,rgba(255,230,90,.4) 12deg 18deg)}
.reveal.x .banner{filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 30px #ff5ce1)}
.reveal.x .banner.show{animation-duration:3s}
.cardback{background:radial-gradient(circle at 50% 50%,rgba(255,203,61,.25),transparent 60%),repeating-linear-gradient(45deg,#2b3aa8 0 .6em,#222d85 .6em 1.2em);border:.45em solid #ffcb3d;border-radius:.9em;display:grid;place-items:center}
.cardback .diamond{width:6em;height:6em;transform:rotate(45deg);background:linear-gradient(135deg,#fff3b0,#e0a800);border:.25em solid #7a4b00;display:grid;place-items:center;box-shadow:0 0 1.5em rgba(255,203,61,.7)}
.cardback .diamond i{font-style:normal;transform:rotate(-45deg);font-size:3em;color:#7a4b00}
.cardback .bk-text{position:absolute;bottom:1.1em;left:0;right:0;text-align:center;font-weight:900;letter-spacing:.25em;font-size:.95em;color:#ffe27a;text-shadow:0 .1em 0 #000}
.card-wrap .cnt{position:absolute;right:-.3em;top:-.5em;background:var(--accent);color:#111;font-weight:900;font-size:.85em;padding:.1em .5em;border-radius:1em;z-index:6}
.locked{width:16em;height:22.4em;font-size:var(--fs,9px);border-radius:.9em;background:#171a36;border:.15em dashed #343a70;display:flex;flex-direction:column;gap:.5em;align-items:center;justify-content:center;color:#4a5088;font-weight:800}
.locked b{font-size:4em}

/* ---------- 리빌 ---------- */
.reveal{position:relative;min-height:calc(100vh - 110px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.stack{position:relative;--fs:15px;font-size:var(--fs);width:16em;height:22.4em;cursor:pointer;z-index:2}
.ghost{position:absolute;inset:0;font-size:inherit}
.ghost.g1{transform:translate(.5em,.5em) rotate(3deg)}
.ghost.g2{transform:translate(-.5em,.8em) rotate(-3deg)}
.stack .card-wrap{position:absolute;left:0;top:0;transition:transform .35s ease-in,opacity .35s}
.stack .card-wrap.enter{animation:enter .45s ease-out}
@keyframes enter{from{transform:translateY(50px) scale(.88);opacity:0}}
.stack .card-wrap.out{transform:translateX(-140%) rotate(-18deg);opacity:0}
.card-wrap.charge{animation:shake .09s infinite,glowUp 1.2s forwards}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-1.2deg)}50%{transform:translate(3px,-3px) rotate(1deg)}75%{transform:translate(-2px,-2px) rotate(-.6deg)}}
@keyframes glowUp{from{filter:drop-shadow(0 0 0 var(--rc))}to{filter:drop-shadow(0 0 36px var(--rc))}}
.card-wrap.glow{filter:drop-shadow(0 0 20px var(--rc))}
.aura{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,var(--ac,#fff),transparent 65%);opacity:0;transition:opacity .6s;filter:blur(12px);z-index:1;pointer-events:none}
.reveal.fx .aura{opacity:.75}
.rays{position:absolute;left:50%;top:50%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;z-index:1;pointer-events:none;opacity:0;transition:opacity .8s;
  background:repeating-conic-gradient(rgba(255,215,90,.4) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:spin 14s linear infinite}
.reveal.ur .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{position:absolute;top:7%;left:0;right:0;text-align:center;font-weight:900;font-size:clamp(26px,5vw,48px);letter-spacing:.15em;opacity:0;pointer-events:none;z-index:4;color:var(--ac,#fff);text-shadow:0 0 18px currentColor,0 3px 0 rgba(0,0,0,.5)}
.banner small{display:block;font-size:.38em;letter-spacing:.3em;color:#fff;margin-top:.3em}
.banner.show{animation:ban 2s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.7)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.tray{display:flex;gap:8px;z-index:3;margin-top:8px}
.slot{width:38px;height:50px;border-radius:7px;border:2px solid #343a70;background:#171a36;display:grid;place-items:center;font-size:22px;transition:.3s}
.slot.cur{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.6)}
.slot.done{background:#22274e}
.reveal .hint{z-index:3}
.skip{position:absolute;right:10px;bottom:10px;z-index:5;font-size:12px;padding:6px 10px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:flash .8s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#app.shake{animation:appshake .5s}
@keyframes appshake{10%{transform:translate(-8px,4px)}30%{transform:translate(7px,-5px)}50%{transform:translate(-6px,3px)}70%{transform:translate(4px,-2px)}}

/* ---------- 결과 ---------- */
.results{min-height:calc(100vh - 110px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.results h2{font-size:22px}
.res-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}

/* ---------- 도감/통계 ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;align-items:center}
.chip{padding:6px 12px;border-radius:99px;border:1px solid #343a70;background:var(--panel);color:var(--text);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:#111;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;justify-items:center;padding-top:8px}
.grid .card-wrap{--fs:9px;cursor:pointer}
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid #2a3068;border-radius:14px;padding:14px}
.stat .v{font-size:26px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid #2a3068;border-radius:14px;padding:16px;margin-bottom:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.rrow{display:grid;grid-template-columns:90px 1fr 120px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.track{position:relative;height:14px;background:#0f1230;border-radius:8px;overflow:hidden}
.track .a{position:absolute;left:0;top:0;bottom:0;border-radius:8px;opacity:.9}
.track .e{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid}
#modal{position:fixed;inset:0;background:rgba(5,6,18,.85);display:none;align-items:center;justify-content:center;z-index:40}
#modal.on{display:flex}
#modal .card-wrap{--fs:17px}
@media(max-width:520px){.stack{--fs:13px}.rrow{grid-template-columns:70px 1fr 90px}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>✦ <span>MONSTER</span> CARDS · 팩 개봉</h1>
  <nav>
    <button data-view="open" class="on">개봉</button>
    <button data-view="col">도감</button>
    <button data-view="stats">통계</button>
    <button id="muteBtn" title="소리">🔊</button>
  </nav>
</header>

<section id="view-open" class="view active">
  <div id="packArea" class="pack-area">
    <div class="pack" id="pack">
      <div class="opening"></div>
      <div class="pack-body foil">
        <div class="sheen"></div>
        <div class="pk-title">MONSTER<br>CARDS</div>
        <div class="pk-emoji">🐉</div>
        <div class="pk-sub">BOOSTER PACK · 5 CARDS</div>
      </div>
      <div class="strip strip-intact foil"></div>
      <div class="strip strip-torn foil"></div>
    </div>
    <p class="hint" id="packHint">팩 윗부분을 왼쪽에서 오른쪽으로 쭉 드래그해서 뜯어보세요</p>
    <button class="btn" id="tearBtn">클릭으로 뜯기</button>
  </div>

  <div id="reveal" class="reveal hide">
    <div class="aura"></div><div class="rays"></div>
    <div class="banner" id="banner"></div>
    <div class="stack" id="stack"></div>
    <div class="tray" id="tray"></div>
    <p class="hint" id="revHint"></p>
    <button class="btn skip" id="skipBtn">결과로 건너뛰기 ⏭</button>
  </div>

  <div id="results" class="results hide">
    <h2 id="resTitle"></h2>
    <div class="res-grid" id="resGrid"></div>
    <button class="btn primary" id="againBtn">새 팩 열기</button>
  </div>
</section>

<section id="view-col" class="view">
  <div class="bar" id="colBar"></div>
  <div class="grid" id="colGrid"></div>
</section>

<section id="view-stats" class="view">
  <div class="cards4" id="statCards"></div>
  <div class="panel"><h3>희귀도별 비율 (막대 = 실제, 흰 선 = 이론 팩 평균)</h3><div id="rarRows"></div></div>
  <div class="panel"><h3>최근 개봉 기록 (팩별 최고 등급)</h3><div class="hist" id="hist"></div></div>
  <button class="btn danger" id="resetBtn">데이터 초기화</button>
</section>
</div>

<div id="modal"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);

/* ================= 데이터 ================= */
const RAR={
  C:{label:'COMMON',sym:'●',w:60,color:'#b0b6c8',hp:50,dmg:20},
  U:{label:'UNCOMMON',sym:'◆',w:25,color:'#5fd38d',hp:80,dmg:40},
  R:{label:'RARE',sym:'★',w:10,color:'#4aa8ff',hp:110,dmg:70},
  SR:{label:'SUPER RARE',sym:'★★',w:4,color:'#c06bff',hp:150,dmg:110},
  UR:{label:'ULTRA RARE',sym:'✦',w:1,color:'#ffcb3d',hp:200,dmg:160}
};
const ORDER=['C','U','R','SR','UR'];
const TYPE={
  fire:{n:'불꽃',c:['#ff7a45','#ffd36b'],atk:'화염 박치기',fl:'꼬리 끝의 불꽃은 기분에 따라 크기가 변한다.'},
  water:{n:'물',c:['#3d8bff','#7be0ff'],atk:'물대포',fl:'물가에서 무리를 지어 살며 비가 오면 신나한다.'},
  grass:{n:'풀',c:['#3fbf6a','#b6f07a'],atk:'덩굴 채찍',fl:'햇볕을 쬐면 몸에서 은은한 향기가 난다.'},
  electric:{n:'전기',c:['#ffc933','#fff49a'],atk:'찌릿 방전',fl:'털을 곤두세우면 주변 전등이 깜빡인다.'},
  psychic:{n:'에스퍼',c:['#b05cff','#ff9be0'],atk:'염력 파동',fl:'밤하늘을 올려다보며 먼 곳의 소리를 듣는다.'},
  wind:{n:'바람',c:['#7fd6c2','#e1f7ff'],atk:'회오리 날개',fl:'날갯짓 한 번에 구름이 갈라진다고 전해진다.'},
  dark:{n:'악',c:['#4a4466','#8d7fb0'],atk:'그림자 습격',fl:'달이 없는 밤에만 모습을 드러낸다.'},
  ice:{n:'얼음',c:['#7fd7ff','#e9fbff'],atk:'눈보라',fl:'숨결이 닿는 곳마다 서리가 내려앉는다.'},
  steel:{n:'강철',c:['#8a97a8','#d4dce6'],atk:'강철 몸통',fl:'단단한 껍질은 어떤 충격에도 흠집이 나지 않는다.'},
  dragon:{n:'용',c:['#ff4d6d','#ffb347'],atk:'용의 숨결',fl:'전설 속에서 하늘과 땅을 다스리던 존재.'}
};
const raw=[
['꿈틀이','🐛','grass','C'],['퐁당이','🐸','water','C'],['짹짹이','🐦','wind','C'],['찌릿쥐','🐭','electric','C'],
['불똥이','🦎','fire','C'],['느릿이','🐌','grass','C'],['박쥐돌','🦇','dark','C'],['윙윙이','🐝','electric','C'],
['꼬물게','🦀','water','C'],['달토끼','🐰','psychic','C'],['솜털양','🐑','wind','C'],['깜장냥','🐱','dark','C'],
['불여우','🦊','fire','U'],['거북물','🐢','water','U'],['고슴잎','🦔','grass','U'],['얼음곰','🐻','ice','U'],
['번개말','🐴','electric','U'],['부엉이','🦉','psychic','U'],['그림자늑대','🐺','dark','U'],['철갑딱정','🪲','steel','U'],
['화염사자','🦁','fire','R'],['파도돌고래','🐬','water','R'],['숲의수호','🦌','grass','R'],['뇌전호랑','🐯','electric','R'],['달빛나비','🦋','psychic','R'],
['폭풍독수리','🦅','wind','SR'],['빙하고래','🐋','ice','SR'],['강철악어','🐊','steel','SR'],
['천룡','🐉','dragon','UR'],['별빛유니콘','🦄','psychic','UR']
];
const CARDS=raw.map((a,i)=>({id:i+1,name:a[0],emoji:a[1],type:a[2],rarity:a[3]}));

/* ================= 저장 ================= */
const KEY='monsterPack_v1';
const blank=()=>({packs:0,cards:0,counts:{},rar:{C:0,U:0,R:0,SR:0,UR:0},history:[]});
let save=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.counts)return s}catch(e){}return blank()})();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ================= 사운드 ================= */
let ctx=null,muted=false;
const ac=()=>{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx};
function tone(f,d=.15,type='sine',v=.1,t0=0,f2){
  if(muted)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d=.2,v=.1,hp=2000){
  if(muted)return;const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),da=b.getChannelData(0);
  for(let i=0;i<n;i++)da[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
const sfx={
  tear:()=>noise(.06,.05,3500),
  rip:()=>{noise(.55,.2,1200);tone(180,.4,'sawtooth',.05,0,60)},
  flip:()=>tone(520,.12,'triangle',.09,0,900),
  next:()=>tone(300,.07,'square',.03),
  charge:(d)=>tone(180,d,'sawtooth',.05,0,900),
  chime:(r)=>{const s={U:[660,880],R:[660,880,1100],SR:[523,659,784,1047],UR:[523,659,784,1047,1319,1568,2093]}[r]||[];s.forEach((f,i)=>tone(f,.45,'triangle',.1,i*.09))}
};

/* ================= 파티클 ================= */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],loopOn=false;
const resize=()=>{cv.width=innerWidth;cv.height=innerHeight};resize();addEventListener('resize',resize);
function burst(x,y,n,colors,speed=8){
  for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(speed*.3,speed);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,dec:rand(.008,.022),size:rand(2,6),color:colors[i%colors.length],star:Math.random()<.45,rot:rand(0,6)})}
  if(!loopOn){loopOn=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);cx.globalCompositeOperation='lighter';
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.life-=p.dec;p.rot+=.1;
    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.color;
    if(p.star){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);const r=p.size;cx.beginPath();
      cx.moveTo(0,-r*1.8);cx.lineTo(r*.4,0);cx.lineTo(0,r*1.8);cx.lineTo(-r*.4,0);cx.closePath();
      cx.moveTo(-r*1.8,0);cx.lineTo(0,r*.4);cx.lineTo(r*1.8,0);cx.lineTo(0,-r*.4);cx.closePath();cx.fill();cx.restore()}
    else{cx.beginPath();cx.arc(p.x,p.y,p.size*.6,0,Math.PI*2);cx.fill()}
  }
  cx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(loop);else{loopOn=false;cx.clearRect(0,0,cv.width,cv.height)}
}
const flash=(color='#fff')=>{const f=$('#flash');f.style.background=color;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
const shake=()=>{const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')};

/* ================= 카드 DOM ================= */
function attachTilt(w){
  w.addEventListener('pointermove',e=>{
    const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    w.style.setProperty('--mx',(x*100).toFixed(1));w.style.setProperty('--my',(y*100).toFixed(1));
    w.style.setProperty('--ry',((x-.5)*26).toFixed(1)+'deg');w.style.setProperty('--rx',((.5-y)*26).toFixed(1)+'deg');
    w.classList.add('active');
  });
  w.addEventListener('pointerleave',()=>{
    w.classList.remove('active');w.style.setProperty('--rx','0deg');w.style.setProperty('--ry','0deg');
  });
}
function buildCard(c,flipped=false,isNew=false){
  const t=TYPE[c.type],R=RAR[c.rarity],w=document.createElement('div');
  w.className=`card-wrap r-${c.rarity}`;
  w.style.setProperty('--t1',t.c[0]);w.style.setProperty('--t2',t.c[1]);w.style.setProperty('--rc',R.color);
  const hp=R.hp+(c.id%4)*10,dmg=R.dmg+(c.id%5)*10;
  w.innerHTML=`<div class="tilt"><div class="flipper${flipped?' flipped':''}">
    <div class="face back cardback"><div class="diamond"><i>✦</i></div><div class="bk-text">MONSTER<br>CARDS</div></div>
    <div class="face front">
      <div class="inner">
        <div class="c-head"><span class="c-name">${c.name}</span><span class="c-hp">HP ${hp}</span></div>
        <div class="c-art"><span class="emoji">${c.emoji}</span><span class="c-type">${t.n}</span></div>
        <div class="c-atk"><div class="row"><span>${t.atk}</span><span>${dmg}</span></div><div class="fl">${t.fl}</div></div>
        <div class="c-foot"><span>${R.sym} ${R.label}</span><span>#${String(c.id).padStart(3,'0')}</span></div>
      </div>
      ${isNew?'<div class="new">NEW!</div>':''}
      <div class="holo"></div><div class="glare"></div>
    </div></div></div>`;
  attachTilt(w);return w;
}

/* ================= 뽑기 ================= */
function pickRarity(noC){
  const e=Object.entries(RAR).filter(([k])=>!(noC&&k==='C')),tot=e.reduce((s,[,v])=>s+v.w,0);
  let r=Math.random()*tot;for(const [k,v] of e){r-=v.w;if(r<=0)return k}return e[0][0];
}
function drawPack(){
  const seen={...save.counts},res=[];
  for(let i=0;i<5;i++){
    const r=pickRarity(i===4),pool=CARDS.filter(c=>c.rarity===r),c=pool[Math.floor(Math.random()*pool.length)];
    res.push({...c,isNew:!seen[c.id]});seen[c.id]=1;
  }
  res.sort((a,b)=>ORDER.indexOf(a.rarity)-ORDER.indexOf(b.rarity));
  // 저장
  save.packs++;save.cards+=5;
  res.forEach(c=>{save.counts[c.id]=(save.counts[c.id]||0)+1;save.rar[c.rarity]++});
  save.history.unshift(res[res.length-1].rarity);save.history=save.history.slice(0,40);
  persist();return res;
}

/* ================= 화면 전환 ================= */
function showStage(n){['packArea','reveal','results'].forEach(id=>$('#'+id).classList.toggle('hide',id!==n))}
function switchView(v){
  $$('.view').forEach(e=>e.classList.toggle('active',e.id==='view-'+v));
  $$('nav button[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='col')renderCol();if(v==='stats')renderStats();
}
$$('nav button[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
$('#muteBtn').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};

/* ================= 팩 뜯기 ================= */
const pack=$('#pack'),sI=$('.strip-intact'),sT=$('.strip-torn');
let tearP=0,dragging=false,sx=0,torn=false,lastTick=0,backRaf=0,pending=null;
function setTear(p){
  tearP=p;const pc=(p*100).toFixed(2);
  sI.style.clipPath=`inset(0 0 0 ${pc}%)`;
  sT.style.clipPath=`inset(0 ${(100-p*100).toFixed(2)}% 0 0)`;
  sT.style.transformOrigin=`${pc}% 100%`;
  sT.style.transform=p>.001?`rotate(${(5+p*28).toFixed(1)}deg)`:'none';
}
setTear(0);
function springBack(){
  const f=()=>{setTear(tearP*.8);if(tearP>.004)backRaf=requestAnimationFrame(f);else setTear(0)};
  backRaf=requestAnimationFrame(f);
}
pack.addEventListener('pointerdown',e=>{
  if(torn)return;ac();dragging=true;cancelAnimationFrame(backRaf);
  sx=e.clientX-tearP*pack.offsetWidth*.9;pack.setPointerCapture(e.pointerId);
});
pack.addEventListener('pointermove',e=>{
  if(!dragging||torn)return;
  const p=Math.max(0,Math.min(1,(e.clientX-sx)/(pack.offsetWidth*.9)));
  const now=performance.now();if(p>tearP+.02&&now-lastTick>55){sfx.tear();lastTick=now}
  setTear(p);if(p>=.97){dragging=false;openPack()}
});
const release=()=>{if(dragging&&!torn){dragging=false;springBack()}};
pack.addEventListener('pointerup',release);pack.addEventListener('pointercancel',release);
$('#tearBtn').onclick=()=>{
  if(torn||dragging)return;ac();cancelAnimationFrame(backRaf);
  const from=tearP,t0=performance.now();
  const f=now=>{
    const k=Math.min(1,(now-t0)/700);setTear(from+(1-from)*k);
    if(now-lastTick>60){sfx.tear();lastTick=now}
    if(k<1)requestAnimationFrame(f);else openPack();
  };requestAnimationFrame(f);
};
async function openPack(){
  if(torn)return;torn=true;cancelAnimationFrame(backRaf);
  setTear(Math.max(tearP,.97));pack.classList.add('opened');sfx.rip();
  const r=pack.getBoundingClientRect();burst(r.left+r.width/2,r.top+30,40,['#fff6c0','#ffe27a','#ffffff'],7);
  pending=drawPack();
  await sleep(750);pack.classList.add('leave');await sleep(550);
  startReveal(pending);
}
function resetPack(){
  torn=false;pack.classList.remove('opened','leave');setTear(0);
  $('#packHint').textContent='팩 윗부분을 왼쪽에서 오른쪽으로 쭉 드래그해서 뜯어보세요';
  showStage('packArea');
}

/* ================= 카드 리빌 ================= */
let cards=[],idx=0,busy=false,flipped=false;
const stack=$('#stack'),revealEl=$('#reveal');
function startReveal(list){
  cards=list;idx=0;flipped=false;busy=false;
  $('#tray').innerHTML=cards.map(()=>'<div class="slot"></div>').join('');
  showStage('reveal');renderCurrent();
}
function renderCurrent(){
  stack.innerHTML='<div class="ghost g1 face cardback"></div><div class="ghost g2 face cardback"></div>';
  $$('.ghost').forEach(g=>{g.style.setProperty('border-radius','.9em')});
  if(idx>=cards.length-1)$$('.ghost').forEach(g=>g.classList.add('hide'));
  const w=buildCard(cards[idx],false,cards[idx].isNew);w.classList.add('enter');stack.appendChild(w);
  revealEl.classList.remove('fx','ur','x');revealEl.style.removeProperty('--ac');
  flipped=false;
  $$('#tray .slot').forEach((s,i)=>s.classList.toggle('cur',i===idx));
  $('#revHint').textContent=`${idx+1} / ${cards.length} · 카드를 클릭해서 뒤집기`;
}
stack.onclick=()=>{if(busy)return;ac();flipped?nextCard():flipCurrent()};
async function flipCurrent(){
  busy=true;const c=cards[idx],r=c.rarity,w=stack.querySelector('.card-wrap'),fl=w.querySelector('.flipper'),R=RAR[r];
  revealEl.style.setProperty('--ac',R.color);
  if(r==='SR'||r==='UR'||r==='X'){
    const d=r==='X'?2600:r==='UR'?1500:950;
    w.classList.add('charge');revealEl.classList.add('fx');sfx.charge(d/1000);
    $('#revHint').textContent='…!!';
    await sleep(d);w.classList.remove('charge');
  }
  sfx.flip();fl.classList.add('flipped');
  await sleep(380);

/* ----- 등급 연출 (카드가 앞면으로 등장할 때) ----- */
function v3fx(c,w){
  const r=c.rarity,R=RAR[r];
  revealEl.style.setProperty('--ac',R.color);
  sfx.flip();sfx.chime(r);
  if(r==='C')return;
  const b=stack.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
  if(r==='U'){burst(x,y,16,[R.color,'#ffffff'],5);return}
  w.classList.add('glow');revealEl.classList.add('fx');
  if(r==='R'){burst(x,y,50,[R.color,'#ffffff'],7);banner(R.label,c.name);return}
  if(r==='SR'){flash('#e8ccff');burst(x,y,110,[R.color,'#ff9be0','#ffffff'],10);banner(R.label,c.name);return}
  if(r==='UR'){
    revealEl.classList.add('ur');flash('#fff4c2');shake();banner(R.label,c.name);
    const gold=['#ffcb3d','#fff0a0','#ffffff','#ff9b3d'];burst(x,y,220,gold,13);
    let n=0;const iv=setInterval(()=>{burst(rand(x-180,x+180),rand(y-220,y+180),16,gold,4);if(++n>14)clearInterval(iv)},170);
    return;
  }
  revealEl.classList.add('ur','x');flash('#ffffff');shake();banner(R.label,c.name);
  const rb=['#ff3d8b','#ffcb3d','#3dff9a','#3dc8ff','#8a3dff','#ffffff'];burst(x,y,320,rb,15);
  let n2=0;const iv2=setInterval(()=>{burst(rand(x-200,x+200),rand(y-240,y+200),20,rb,4);if(++n2>26)clearInterval(iv2)},150);
  setTimeout(()=>{flash('#ffe6ff');shake()},700);
}

/* ----- 카드 한 장 표시 ----- */
function v3render(){
  const list=v3list,i=v3i,c=list[i],n=list.length,rem=n-1-i,P=V3PACKS[v3packNo()];
  revealEl.classList.remove('fx','ur','x');
  stack.classList.remove('peek');
  stack.classList.toggle('p2',v3packNo()===2);
  stack.innerHTML='';
  for(let k=rem;k>=1;k--){
    const p=document.createElement('div');
    p.className='pile gl-'+list[i+k].rarity;p.style.setProperty('--k',k);
    const pc=buildCard(list[i+k],true,false);
    pc.classList.add('blind');
    p.appendChild(pc);
    p.insertAdjacentHTML('beforeend',`<i class='edge t${v3tier(list[i+k].rarity)}'></i>`);
    stack.appendChild(p);
  }
  const w=buildCard(c,true,c.isNew);
  w.classList.add('enter','v3front');
  stack.appendChild(w);
  if(rem>0){
    const hz=document.createElement('div');hz.className='hz';
    hz.addEventListener('pointerenter',ev=>{if(ev.pointerType!=='touch')v3setPeek(true)});
    hz.addEventListener('pointerleave',()=>{if(!v3held)v3setPeek(false)});
    hz.addEventListener('pointerdown',ev=>{if(ev.pointerType!=='touch')return;clearTimeout(v3touchT);v3touchT=setTimeout(()=>{v3held=true;v3setPeek(true)},170)});
    ['pointerup','pointercancel'].forEach(t=>hz.addEventListener(t,()=>{clearTimeout(v3touchT);if(v3held){v3setPeek(false);setTimeout(()=>{v3held=false},80)}}));
    stack.appendChild(hz);
  }
  $$('#tray .slot').forEach((s,j)=>{
    const cj=list[j];s.classList.toggle('cur',j===i);
    if(j<=i){s.classList.add('done');s.textContent=cj.emoji;s.style.borderColor=RAR[cj.rarity].color}
    else{s.classList.remove('done');s.textContent='';s.style.borderColor=''}
  });
  $('#revHint').textContent=`${c.isNew?'🆕 신규 카드! ':''}${i+1} / ${n} · 클릭해서 ${i===n-1?'결과 보기':'다음 카드'}${rem>0?' · 카드 왼쪽 끝에 마우스를 올려 남은 카드의 기운을 엿보세요':''}`;
  const lg=$('#peekLegend');if(lg)lg.style.display=rem>0?'flex':'none';
  v3fx(c,w);
}
function v3begin(list){

  const tray=$('#tray');tray.innerHTML='';
  list.forEach(()=>{const s=document.createElement('div');s.className='slot';tray.appendChild(s)});
  v3ensureLegend();v3fixLegend();
  v3render();
}
function v3tryBegin(){

}
let v3goT=0;
async function v3click(){
  if(!v3active||v3busy||v3held)return;
  const SLIDE=1100,LOCK=500;
  v3busy=true;sfx.next();v3setPeek(false);
  const f=stack.querySelector('.v3front');
  if(v3i+1>=v3list.length){
    stack.classList.add('v3going');
    if(f)f.classList.add('out');
    await sleep(SLIDE);
    v3i++;v3busy=false;stack.classList.remove('v3going');showResults();return;
  }
  const olds=[...stack.querySelectorAll('.v3ghost')];
  let g=null;
  if(f){
    g=f.cloneNode(true);
    g.classList.remove('enter','v3rise');
    g.classList.add('out','v3ghost');
    g.style.zIndex='5';
  }
  v3i++;
  stack.classList.add('v3going');
  v3render();
  stack.querySelectorAll('.v3front,.v3front .card-wrap').forEach(e=>{e.style.animation='none'});
  const nf=stack.querySelector('.v3front');
  if(nf)nf.classList.add('v3rise');
  olds.forEach(o=>stack.appendChild(o));
  if(g){stack.appendChild(g);setTimeout(()=>g.remove(),SLIDE+60)}
  clearTimeout(v3goT);

  setTimeout(()=>{v3busy=false},LOCK);
}
const v3clickBase=v3click;
v3click=function(){

  /* ===== 드래그 팩 뜯기: 가위 ===== */
  try{(function dragScissors(){

    if(!pk||!sT)return;
    let sc=null,done=false,lastB=0;
    const W=()=>pk.offsetWidth||230;
    const getP=()=>{const m=/([0-9.]+)%/.exec(sT.style.clipPath||'');return m?Math.max(0,Math.min(1,1-parseFloat(m[1])/100)):0};
    function ensure(){

  /* ===== 5팩 연속 개봉 ===== */
  let m5on=false;
  async function run5(){
    if(m5on)return;
    if(typeof drawPack!=='function'||typeof buildCard!=='function')return;

    if(base&&base.classList.contains('opened'))return;
    m5on=true;
    const pa=$('#packArea'),wasShown=!!pa&&!pa.classList.contains('hide');

    document.body.appendChild(ov);

    const keyBlock=e=>{if(e.code==='Space'){e.preventDefault();e.stopImmediatePropagation()}};
    const esc=e=>{

    addEventListener('keydown',keyBlock,true);addEventListener('keydown',esc,true);

    function sweep(pk,sc,dur){
      return new Promise(res=>{
        const t0=performance.now(),sI=pk.querySelector('.strip-intact'),sT=pk.querySelector('.strip-torn'),w=pk.offsetWidth||230;
        let lb=0;
        (function f(now){
          let t=Math.min(1,(now-t0)/dur);if(skip)t=1;
          const p=t*t*(3-2*t);
          sc.style.left=(p*w-62)+'px';
          if(sI)sI.style.clipPath=`inset(0 0 0 ${(p*100).toFixed(2)}%)`;
          if(sT)sT.style.clipPath=`inset(0 ${(100-p*100).toFixed(2)}% 0 0)`;
          if(now-lb>55&&!skip){
            lb=now;
            try{const r=pk.getBoundingClientRect();burst(r.left+p*r.width,r.top+r.height*46/350,2,['#ffffff','#cfe8ff','#d9ccff'],2.4);sfx.tear()}catch(_){}

      });
    }

    const packs=[];

      for(let i=0;i<5;i++){

          cd.style.filter='drop-shadow(0 0 22px '+c+')';
          stage.appendChild(cd);
          if(!skip){
            try{
              if(ORD.indexOf(r)>=1){
                const n={U:30,R:50,SR:90,UR:140,X:220}[r];

                sfx.chime(r==='X'?'UR':r);

            }catch(_){}

          dEls[i].classList.add('on');dEls[i].style.setProperty('--c',c);dEls[i].textContent='PACK '+(i+1)+' · '+r;

          dEls[i].classList.add('on');dEls[i].style.setProperty('--c',c);dEls[i].textContent='PACK '+(i+1)+' · '+r;

      const nw=all.filter(x=>x.isNew).length,top=bestOf(all);

        +`<span class='m5c' style='--c:${COL[top.rarity]}'>최고 ${top.rarity} · ${top.name}</span>`;
      resEl.appendChild(sum);
      const per=innerWidth<640?3:5,avail=Math.min(innerWidth-32,860);
      const fs=Math.max(5,Math.min(10,(avail-(per-1)*8)/per/16));
      packs.forEach((p,i)=>{
        const b=bestOf(p),g=document.createElement('div');g.className='m5grp';
        g.innerHTML=`<div class='m5gh'><span>PACK ${i+1}</span><span style='color:${COL[b.rarity]}'>최고 ${b.rarity}</span></div>`;
        const row=document.createElement('div');row.className='m5g';
        p.forEach(x=>{const w=buildCard(x,true,!!x.isNew);w.style.setProperty('--fs',fs+'px');w.__c=x;row.appendChild(w)});
        g.appendChild(row);resEl.appendChild(g);

        const w=e.target.closest('.card-wrap');if(!w||!w.__c||!md)return;
        md.innerHTML='';md.appendChild(buildCard(w.__c,true,false));md.classList.add('on');
      });
      ov.appendChild(resEl);
      const foot=document.createElement('div');foot.className='m5foot';
      foot.innerHTML=`<button class='btn primary' id='m5again'>다시 5팩 열기</button><button class='btn' id='m5close'>닫기</button>`;
      ov.appendChild(foot);

      er.innerHTML=`<div>5팩 연출 중 오류가 발생했어요<br><small style='color:#ff8da1'>${String((e&&e.message)||e)}</small><br><br><button class='btn primary'>닫기</button></div>`;

  }

})()}catch(e){console.warn('multiPack',e)}

try{(function bulkSynth(){

      sec.prepend(d);
    }

    /* ③ 광고 자동 합성 버튼 아래 보상 안내 */
    document.querySelectorAll('button').forEach(b=>{
      if(b.dataset.prn||b.closest('[data-pr],[data-m5ui]'))return;
      const t=norm(b.textContent);if(!(t.includes('광고')&&t.includes('합성')))return;
      b.dataset.prn='1';
      let anc=b;const p=b.parentElement;
      if(p&&p!==document.body){const cs=getComputedStyle(p);if(cs.display.indexOf('flex')>=0&&cs.flexDirection.indexOf('column')<0)anc=p}
      if(anc.nextElementSibling&&anc.nextElementSibling.classList.contains('pr-adnote'))return;
      const n=document.createElement('small');n.className='pr-adnote';n.setAttribute('data-pr','1');
      n.innerHTML=`🎁 광고 보상: 겹친 카드 자동 합성 · 성공률·천장은 합성 확률표와 같아요 · <span class="pr-link" data-pr-open="syn">ⓘ 확률 보기</span>`;
      anc.after(n);
    });
  }

  /* 클릭·키보드: 진입점 열기 / 창이 열려 있으면 게임 단축키 막기 */
  document.addEventListener('click',e=>{
    const o=e.target.closest&&e.target.closest('[data-pr-open]');if(!o)return;
    e.preventDefault();e.stopPropagation();open(o.getAttribute('data-pr-open'));
  },true);
  addEventListener('keydown',e=>{
    if(ov){
      if(e.key==='Escape'){close();e.stopPropagation();e.stopImmediatePropagation();return}
      if(e.key===' '||e.key==='Enter'||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.stopPropagation();e.stopImmediatePropagation()}
      return;
    }
    const o=e.target&&e.target.closest&&e.target.closest('[data-pr-open]');
    if(o&&(e.key===' '||e.key==='Enter')){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(o.getAttribute('data-pr-open'))}
  },true);

  let q=0;
  const kick=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;inject()})};
  new MutationObserver(kick).observe(document.body,{childList:true,subtree:true});
  addEventListener('resize',kick);
  setInterval(inject,1500);
  inject();
  if(!src().live)console.warn('probInfo: MP_DATA를 읽지 못해 기본 설정값으로 확률을 표시합니다. (패치 ⑤ 확인)');
})()}catch(e){console.warn('probInfo',e)}

</script>
</body>
</html>
